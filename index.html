<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>세컨드 브레인</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a60ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="세컨드 브레인" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>세컨드 브레인</h1>
      <aside id="install-tip" hidden>
        <strong>홈 화면에 추가해서 쓰세요</strong>
        <p>사파리 아래쪽 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 열려요.</p>
        <p>오래 안 쓰면 폰이 저장된 내용을 지울 수 있어요. <b>내보내기</b>로 백업을 자주 해 두세요.</p>
      </aside>
      <section id="backup" aria-label="백업">
        <div class="actions">
          <button type="button" id="export-btn">내보내기</button>
          <button type="button" id="import-btn" class="secondary">가져오기</button>
          <input id="import-file" type="file" accept="application/json,.json" aria-label="가져오기 파일" hidden />
        </div>
        <p id="backup-status"></p>
        <p id="backup-message" role="status"></p>
      </section>
      <form id="memo-form">
        <textarea id="memo-input" rows="3" placeholder="무슨 생각이 나세요?" aria-label="메모 입력"></textarea>
        <button type="submit">저장</button>
      </form>
      <form id="link-form">
        <input id="link-url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="링크를 붙여넣으세요" aria-label="링크 주소" />
        <input id="link-desc" type="text" placeholder="링크 설명 (선택)" aria-label="링크 설명" />
        <button type="submit">링크 추가</button>
      </form>
      <form id="photo-form">
        <input id="photo-file" type="file" accept="image/*" aria-label="사진 선택" />
        <input id="photo-desc" type="text" placeholder="사진 설명 (선택)" aria-label="사진 설명" />
        <button type="submit">사진 추가</button>
      </form>
      <input id="search" type="search" placeholder="검색" aria-label="검색" autocomplete="off" />
      <p id="empty" hidden>결과가 없어요</p>
      <section id="list" aria-label="저장한 항목"></section>
      <section id="detail" hidden aria-label="메모 보기">
        <textarea id="detail-input" rows="6" aria-label="메모 수정"></textarea>
        <div class="actions">
          <button type="button" id="detail-save">수정 저장</button>
          <button type="button" id="detail-delete" class="danger">삭제</button>
          <button type="button" id="detail-close" class="secondary">닫기</button>
        </div>
      </section>
    </main>
    <div id="viewer" role="dialog" aria-label="사진 크게 보기" hidden>
      <img id="viewer-img" alt="" />
      <p id="viewer-caption"></p>
      <button type="button" id="viewer-close">사진 닫기</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
